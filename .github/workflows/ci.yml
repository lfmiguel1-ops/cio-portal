# CI: roda os testes a cada push e PR, nos dois dialetos (SQLite e PostgreSQL 17). Custo zero no plano free.
name: ci
on: [push, pull_request]
jobs:
  testes-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  testes-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: cio_portal
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          CIO_TEST_DATABASE_URL: postgresql://postgres:teste@localhost:5432/cio_portal
