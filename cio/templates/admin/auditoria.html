{% extends "base.html" %}
{% block content %}
<h1>Auditoria</h1>
{% include "admin/_nav.html" %}
<div class="tabela"><table><thead><tr><th>Quando</th><th>Usuário</th><th>Ação</th><th>Alvo</th><th>Detalhes</th></tr></thead><tbody>

</tbody></table></div>
{% endblock %}
